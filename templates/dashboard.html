{% extends "base.html" %}

{% block content %}
<section class="dashboard-page">
    <h1>Welcome to your Dashboard!</h1>
    <div class="dashboard-action-grid">
        <div class="dashboard-action-card-wrap">
            <a class="dashboard-action-card" href="{{ url_for('newsession') }}">
                <article>
                    <h2 class="dashboard-action-card-title">New Session</h2>
                </article>
            </a>
        </div>
        <div class="dashboard-action-card-wrap">
            <a class="dashboard-action-card" href="{{ url_for('selectsession') }}">
                <article>
                    <h2 class="dashboard-action-card-title">Select Session</h2>
                </article>
            </a>
        </div>
    </div>
</section>
{% endblock %}
